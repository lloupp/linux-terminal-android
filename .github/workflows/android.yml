name: Android CI
on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:
    branches: [main, dev, 'feat/**']
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125'
      - run: bash scripts/build-proot.sh && bash scripts/fetch-runtime-test.sh
      - name: Restore private Preview signing when configured
        if: env.PREVIEW_KEYSTORE_BASE64 != ''
        run: |
          umask 077
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/preview.p12"
          echo "ANDROID_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview.p12" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - run: gradle lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify packaged native ABIs
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for library in libtermux.so libproot.so libproot-loader.so; do
              unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/$abi/$library"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-terminal-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/
  pty-emulator:
    needs: build
    runs-on: ubuntu-latest
    env:
      PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;26.1.10909125'
      - run: bash scripts/build-proot.sh && bash scripts/fetch-runtime-test.sh
      - name: Restore private Preview signing when configured
        if: env.PREVIEW_KEYSTORE_BASE64 != ''
        run: |
          umask 077
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/preview.p12"
          echo "ANDROID_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview.p12" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.runtimeNetworkProof=true --stacktrace
            adb shell am start -n com.linuxterminal.android.preview/com.linuxterminal.android.MainActivity
            adb exec-out screencap -p > app/build/reports/androidTests/terminal-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
