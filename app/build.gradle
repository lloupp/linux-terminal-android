plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.linuxterminal.android'
    compileSdk 34
    defaultConfig {
        applicationId 'com.linuxterminal.android'
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        targetSdk 34
        versionCode 4
        versionName "0.3.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    // Private signing material must remain outside Git. CI may supply a protected secret.
    def previewKeystore = System.getenv('ANDROID_PREVIEW_KEYSTORE')
    if (previewKeystore) {
        signingConfigs {
            preview {
                storeFile file(previewKeystore)
                storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            if (previewKeystore) signingConfig signingConfigs.preview
            resValue 'string', 'app_name', 'Linux Terminal Preview'
        }
        release { resValue 'string', 'app_name', 'Linux Terminal' }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation project(':terminal-view')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
}
